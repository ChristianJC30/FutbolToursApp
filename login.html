<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de Sesión</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="form-container">
    <h2>Iniciar Sesión</h2>

    <form method="POST" action="../backend/login_process.php">
      <input type="email" name="email" placeholder="Correo electrónico" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>

    <p id="mensaje"></p>
    <p>¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has("error")) {
      const err = params.get("error");
      if (err === "correo") mensaje.innerText = "No existe una cuenta con ese correo.";
      if (err === "contraseña") mensaje.innerText = "Contraseña incorrecta.";
    }
    if (params.has("success")) {
      mensaje.innerText = "Registro exitoso. Inicia sesión.";
    }
  </script>
</body>
</html>
